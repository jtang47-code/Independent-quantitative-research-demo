<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f55">
    <meta name="description" content="Independent Quantitative Research by Jie Tang">
    <title>Independent Quantitative Research — Jie Tang</title>
    <style>

      :root {
        --ink: #122b48;
        --ink-soft: #5a6d80;
        --navy: #102f55;
        --navy-deep: #0a2341;
        --blue: #22639b;
        --blue-soft: #9ec9df;
        --paper: #f4f3ee;
        --paper-light: #fbfaf6;
        --line: #d6dde4;
        --line-dark: #315579;
        --signal: #7d8995;
        --white: #fffefa;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      a, button { font: inherit; }
      a { color: inherit; text-decoration: none; }
      button { border: 0; }
      ::selection { background: var(--blue-soft); color: var(--navy-deep); }
      .site-shell { min-width: 320px; overflow: hidden; background: var(--paper); }
      .content-width { width: min(1320px, calc(100% - 56px)); margin: 0 auto; }
      .skip-link {
        position: fixed; top: 10px; left: 10px; z-index: 100; padding: 8px 12px;
        transform: translateY(-150%); background: var(--white); color: var(--ink);
        border: 1px solid var(--line); box-shadow: 0 8px 24px rgb(14 47 86 / 15%);
      }
      .skip-link:focus { transform: translateY(0); }

      .site-nav {
        position: sticky; top: 0; z-index: 30; display: flex; align-items: center;
        min-height: 70px; padding: 0 32px; background: rgb(244 243 238 / 94%);
        border-bottom: 1px solid var(--line); backdrop-filter: blur(14px);
      }
      .brand { display: inline-flex; align-items: center; flex: none; }
      .brand strong, .brand small { display: block; }
      .brand strong { font-size: 13px; letter-spacing: .01em; }
      .brand small { margin-top: 2px; color: var(--ink-soft); font-size: 10px; letter-spacing: .08em; line-height: 1.2; }
      .site-nav .brand strong { font-size: 13px; letter-spacing: .01em; }
      .site-nav .brand small { margin-top: 2px; font-size: 10px; letter-spacing: .08em; line-height: 1.2; }
      .nav-links { display: flex; align-items: center; margin-left: auto; }
      .menu-toggle {
        display: none; margin-left: auto; padding: 7px 10px; background: transparent;
        border: 1px solid var(--line); color: var(--ink); cursor: pointer; font-size: 10px;
        letter-spacing: .12em; text-transform: uppercase;
      }
      .nav-demo-menu { position: relative; }
      .nav-demo-trigger {
        display: inline-flex; align-items: center; gap: 10px; position: relative; padding: 25px 0 23px;
        background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 11px;
        letter-spacing: .05em;
      }
      .nav-demo-trigger span { color: var(--signal); font-size: 16px; line-height: .7; transition: transform 160ms ease; }
      .nav-demo-trigger:hover, .nav-demo-trigger:focus-visible { color: var(--ink); }
      .nav-demo-trigger:hover span, .nav-demo-trigger:focus-visible span, .nav-demo-menu-open .nav-demo-trigger span { transform: rotate(45deg); }
      .nav-demo-trigger::after {
        position: absolute; right: 0; bottom: 17px; left: 0; height: 1px; background: var(--blue);
        content: ''; transform: scaleX(0); transform-origin: right; transition: transform 180ms ease;
      }
      .nav-demo-trigger:hover::after, .nav-demo-trigger:focus-visible::after, .nav-demo-menu-open .nav-demo-trigger::after { transform: scaleX(1); transform-origin: left; }
      .nav-dropdown {
        position: absolute; top: calc(100% - 1px); right: 0; z-index: 40; width: 245px; padding: 14px 16px 8px;
        background: var(--paper-light); border: 1px solid var(--line); box-shadow: 0 16px 30px rgb(14 47 86 / 14%);
        opacity: 0; pointer-events: none; transform: translateY(-6px); transition: opacity 160ms ease, transform 160ms ease;
      }
      .nav-demo-menu:hover .nav-dropdown, .nav-demo-menu:focus-within .nav-dropdown, .nav-demo-menu-open .nav-dropdown { opacity: 1; pointer-events: auto; transform: translateY(0); }
      .dropdown-kicker { margin-bottom: 8px; color: var(--blue); font-size: 9px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
      .nav-dropdown a { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 11px; border-top: 1px solid var(--line); color: var(--ink); font-size: 13px; }
      .nav-dropdown a span { color: var(--signal); font-size: 16px; }
      .nav-dropdown a:hover, .nav-dropdown a:focus-visible { color: var(--blue); }

      .page-view { min-height: calc(100vh - 70px); }
      .page-view.view-leaving { opacity: 0; transform: translateY(8px); filter: blur(1px); transition: opacity 220ms ease, transform 220ms ease, filter 220ms ease; }
      .page-view.view-entering { animation: view-enter 460ms cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes view-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      .eyebrow, .card-overline, .case-kicker, .case-fact span,
      .case-chart-overline, .case-metric-label, .case-summary-label, .case-detail-label, .case-status,
      .footer-note, .table-label {
        font-size: 9px; font-weight: 700; letter-spacing: .15em; line-height: 1.3; text-transform: uppercase;
      }
      .eyebrow { color: var(--blue); }
      .eyebrow-light { color: var(--blue-soft); }
      .section-bar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
      .section-bar .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .section { padding: 54px 0; scroll-margin-top: 70px; }

      /* Home */
      .home-hero { position: relative; isolation: isolate; overflow: visible; background: var(--navy); color: var(--white); }
      .home-hero::before {
        position: absolute; inset: 0; z-index: 0; background-image:
          linear-gradient(to right, rgb(255 254 250 / 12%) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(255 254 250 / 9%) 1px, transparent 1px);
        background-position: 0 0; background-size: 96px 100%, 100% 64px; content: '';
        opacity: .9; -webkit-mask-image: linear-gradient(to right, #000 0%, #000 18%, rgb(0 0 0 / 58%) 36%, transparent 51%);
        mask-image: linear-gradient(to right, #000 0%, #000 18%, rgb(0 0 0 / 58%) 36%, transparent 51%);
        pointer-events: none;
      }
      .home-hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 60px; align-items: center; min-height: 405px; padding: 58px 0 48px; }
      .home-hero h1 { max-width: 650px; margin: 17px 0 0; color: var(--white); font-family: 'Times New Roman', Times, serif; font-size: clamp(2.5rem, 4.1vw, 3.5rem); font-weight: 400; letter-spacing: -.06em; line-height: .94; }
      .home-hero h1 span { color: var(--blue-soft); }
      .home-lede { max-width: 610px; margin: 22px 0 0; color: #c7d5df; font-size: 14px; line-height: 1.65; }
      .hero-link, .case-back { display: inline-flex; align-items: center; gap: 12px; margin-top: 24px; padding-bottom: 6px; border-bottom: 1px solid #6f9cb8; color: var(--white); font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
      .hero-link span, .case-back span { color: var(--signal); font-size: 16px; line-height: .7; }
      .hero-link:hover, .hero-link:focus-visible, .case-back:hover, .case-back:focus-visible { color: var(--blue-soft); border-bottom-color: var(--blue-soft); }
      .hero-demo-menu { position: relative; display: inline-block; margin-top: 24px; }
      .hero-demo-trigger { display: inline-flex; align-items: center; gap: 12px; padding: 0 0 6px; background: transparent; border-bottom: 1px solid #6f9cb8; color: var(--white); cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: .07em; line-height: 1.5; text-transform: uppercase; }
      .hero-demo-trigger span { color: var(--signal); font-size: 17px; line-height: .7; transition: transform 160ms ease; }
      .hero-demo-trigger:hover, .hero-demo-trigger:focus-visible { color: var(--blue-soft); border-bottom-color: var(--blue-soft); }
      .hero-demo-trigger:focus-visible { outline: 1px solid var(--blue-soft); outline-offset: 5px; }
      .hero-demo-menu-open .hero-demo-trigger span { transform: rotate(45deg); }
      .hero-demo-dropdown { position: absolute; top: calc(100% + 12px); left: 0; z-index: 12; display: none; width: 300px; padding: 14px 16px 8px; background: var(--paper-light); border: 1px solid var(--line); box-shadow: 0 16px 30px rgb(5 22 42 / 26%); }
      .hero-demo-menu-open .hero-demo-dropdown { display: block; }
      .hero-demo-dropdown a { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0 11px; border-top: 1px solid var(--line); color: var(--ink); font-size: 13px; line-height: 1.35; }
      .hero-demo-copy { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
      .hero-demo-copy strong { color: inherit; font-size: 13px; font-weight: 400; }
      .hero-demo-copy small { color: var(--ink-soft); font-size: 11px; line-height: 1.25; }
      .hero-demo-arrow { color: var(--signal); font-size: 16px; flex: none; }
      .hero-demo-dropdown a:hover, .hero-demo-dropdown a:focus-visible { color: var(--blue); }
      .hero-facts { align-self: center; border: 0; }
      .scope-flow { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr); column-gap: 10px; padding: 0 0 62px; }
      .scope-step { position: relative; min-height: 184px; padding: 17px 10px 15px; background: rgb(255 255 255 / 3%); border: 1px solid rgb(158 201 223 / 35%); border-top: 2px solid var(--blue-soft); box-shadow: inset 0 1px 0 rgb(255 255 255 / 5%), 0 10px 24px rgb(5 22 42 / 14%); }
      .scope-step:nth-of-type(even) { border-top-color: var(--signal); }
      .scope-step-index { display: block; color: var(--blue-soft); font-family: 'Times New Roman', Times, serif; font-size: 27px; letter-spacing: -.05em; line-height: .9; }
      .scope-step-label { max-width: 100%; min-height: 2.5em; margin-top: 11px; color: var(--blue-soft); font-size: 10px; font-weight: 700; letter-spacing: .13em; line-height: 1.25; text-transform: uppercase; white-space: normal; overflow-wrap: normal; word-break: normal; }
      .scope-step strong { display: block; margin-top: 13px; color: var(--white); font-size: 13px; font-weight: 400; line-height: 1.35; overflow-wrap: break-word; }
      .scope-flow::before { position: absolute; right: calc((100% - 138px) / 8 - 1px); bottom: 21px; left: calc((100% - 138px) / 8 - 1px); height: 2px; border-radius: 999px; background: rgb(158 201 223 / 70%); content: ''; }
      .scope-step::before { position: absolute; bottom: -41px; left: 50%; width: 2px; height: 41px; border-radius: 999px; background: rgb(158 201 223 / 70%); content: ''; filter: drop-shadow(0 0 5px rgb(158 201 223 / 15%)); transform: translateX(-50%); }
      .scope-step:nth-of-type(-n+3)::before { width: 7px; border-radius: 0; clip-path: polygon(35% 100%, 65% 100%, 65% 22%, 100% 22%, 50% 0, 0 22%, 35% 22%); }
      .scope-arrow { display: grid; align-self: center; justify-self: center; width: 26px; height: 30px; color: var(--blue-soft); filter: drop-shadow(0 0 6px rgb(158 201 223 / 18%)); }
      .scope-arrow svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .scope-arrow path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; }
      .home-method { background: var(--paper-light); }
      .home-method-head { display: block; margin: 23px 0 24px; }
      .home-method-head h2, .case-section h2 { margin: 0; font-family: 'Times New Roman', Times, serif; font-weight: 400; letter-spacing: -.045em; line-height: 1.02; }
      .home-method-head h2 { max-width: 760px; font-size: clamp(1.95rem, 3.2vw, 3rem); }
      .method-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .method-card { min-height: 183px; padding: 17px 16px; background: var(--paper); border: 1px solid var(--line); }
      .method-card .card-overline { color: var(--signal); }
      .method-card h3 { margin: 25px 0 0; font-size: 15px; line-height: 1.25; }
      .method-card p { margin: 9px 0 0; color: var(--ink-soft); font-size: 11.5px; line-height: 1.55; }

      .site-footer { padding: 19px 0; background: var(--navy-deep); color: #c7d5df; }
      .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .brand-footer strong { color: var(--white); }
      .brand-footer small { color: #83acc5; }
      .footer-right { display: flex; align-items: center; gap: 20px; margin-left: auto; }
      .footer-links { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
      .footer-links a { color: #c7d5df; font-size: 10px; letter-spacing: .04em; transition: color 160ms ease, border-color 160ms ease; }
      .footer-links a:hover, .footer-links a:focus-visible { color: var(--white); border-bottom: 1px solid var(--blue-soft); }
      .footer-note { margin: 0; color: #83acc5; font-size: 9px; letter-spacing: .04em; text-align: right; }
      .footer-inner > a:hover, .footer-inner > a:focus-visible { color: var(--white); }

      /* Premarket-to-Intraday Ranking */
      .case-view { background: var(--paper); color: var(--ink); }
      .case-head { padding: 28px 0 0; background: var(--paper-light); border-bottom: 1px solid var(--line); }
      .case-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
      .case-kicker { color: var(--blue); }
      .case-toolbar .case-back { margin: 0; color: var(--blue); border-bottom-color: var(--blue); }
      .case-toolbar .case-back:hover, .case-toolbar .case-back:focus-visible { color: var(--ink); border-bottom-color: var(--signal); }
      .case-title-row { display: block; padding: 28px 0 25px; }
      .case-title-row h1 { max-width: 1120px; margin: 0; font-family: 'Times New Roman', Times, serif; font-size: clamp(2.1rem, 3.3vw, 3.35rem); font-weight: 400; letter-spacing: -.06em; line-height: .96; }
      .case-title-row p { max-width: 700px; margin: 16px 0 0; color: var(--ink-soft); font-size: 13px; line-height: 1.6; }
      .case-facts { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
      .case-fact { min-height: 66px; padding: 13px 14px 10px 0; border-right: 1px solid var(--line); }
      .case-fact:not(:first-child) { padding-left: 14px; }
      .case-fact:last-child { border-right: 0; }
      .case-fact span { display: block; color: var(--blue); font-size: 8px; }
      .case-fact strong { display: block; margin-top: 5px; font-size: 11.5px; font-weight: 600; }
      .case-section { padding: 48px 0; scroll-margin-top: 70px; }
      .case-section-paper { background: var(--paper); }
      .case-section-light { background: var(--paper-light); border-top: 1px solid var(--line); }
      .case-section-tint { background: #edf2f5; border-top: 1px solid var(--line); }
      .case-section-dark { background: var(--navy); color: var(--white); }
      .case-section-dark .section-bar { border-bottom-color: var(--line-dark); }
      .case-section-dark .eyebrow { color: var(--blue-soft); }
      .case-section-heading { display: flex; align-items: end; justify-content: space-between; gap: 40px; margin: 22px 0 24px; }
      .case-section-heading h2 { max-width: 700px; font-size: clamp(2rem, 3.7vw, 3.45rem); }
      .case-section-heading p { max-width: 420px; margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.6; }
      .case-section-dark .case-section-heading p { color: #c7d5df; }
      .case-performance-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, .55fr); gap: 12px; }
      .case-chart-card, .case-summary-panel, .case-matrix-card, .case-note-block { border: 1px solid var(--line); background: var(--paper-light); }
      .case-chart-card { min-width: 0; padding: 16px 17px 11px; }
      .case-chart-header { display: flex; align-items: start; justify-content: space-between; gap: 18px; }
      .case-chart-overline, .case-summary-label, .case-metric-label { color: var(--blue); }
      .case-chart-header h3 { margin: 0; font-size: 17px; font-weight: 600; }
      .case-chart-controls { display: inline-flex; border: 1px solid var(--line); }
      .case-chart-controls button { padding: 7px 9px; background: var(--paper); color: var(--ink-soft); cursor: pointer; font-size: 10px; }
      .case-chart-controls button + button { border-left: 1px solid var(--line); }
      .case-chart-controls button:hover, .case-chart-controls button:focus-visible, .case-chart-controls .case-chart-control-active { background: var(--navy); color: var(--white); }
      .case-chart-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 15px; margin-top: 15px; color: var(--ink-soft); font-size: 10px; }
      .case-legend-strategy::before { display: inline-block; width: 17px; height: 2px; margin: 0 6px 3px 0; background: var(--navy); content: ''; }
      .case-legend-benchmark::before { display: inline-block; width: 17px; height: 2px; margin: 0 6px 3px 0; background: #9aa6b5; content: ''; }
      .case-chart-note { margin-left: auto; color: #7d8995; }
      .case-chart-frame { min-height: 320px; margin-top: 5px; }
      .case-chart-frame canvas { display: block; width: 100%; height: 320px; }
      .case-chart-foot { display: flex; justify-content: space-between; gap: 15px; padding-top: 8px; border-top: 1px solid var(--line); color: #7d8995; font-size: 10px; }
      .case-summary-panel { padding: 17px 17px 14px; }
      .case-summary-value { margin-top: 15px; font-family: 'Times New Roman', Times, serif; font-size: 48px; letter-spacing: -.06em; line-height: .9; }
      .case-summary-value span { color: var(--signal); font-size: 22px; }
      .case-summary-panel > p { margin: 12px 0 20px; color: var(--ink-soft); font-size: 11.5px; line-height: 1.55; }
      .case-summary-list { border-top: 1px solid var(--line); }
      .case-summary-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 10.5px; }
      .case-summary-row span { color: var(--ink-soft); }
      .case-summary-row strong { text-align: right; font-weight: 600; }
      .case-metrics { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 12px; border: 1px solid var(--line); background: var(--paper-light); }
      .case-metric { min-height: 84px; padding: 13px 14px 10px; border-right: 1px solid var(--line); }
      .case-metric:last-child { border-right: 0; }
      .case-metric-value { margin-top: 10px; font-family: 'Times New Roman', Times, serif; font-size: 25px; letter-spacing: -.04em; line-height: 1; }
      .case-metric-note { margin-top: 5px; color: #7d8995; font-size: 9px; }
      .case-period-comparison { margin-top: 12px; border: 1px solid var(--line); background: var(--paper-light); }
      .case-period-table { table-layout: fixed; }
      .case-period-table caption { padding: 13px 14px 6px; color: var(--blue); font-size: 9px; font-weight: 700; letter-spacing: .15em; text-align: left; text-transform: uppercase; caption-side: top; }
      .case-period-table th, .case-period-table td { padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 11px; line-height: 1.2; }
      .case-period-table th:first-child { width: 42%; }
      .case-period-table thead th { color: var(--blue); font-size: 9px; letter-spacing: .08em; text-align: right; text-transform: uppercase; }
      .case-period-table thead th:first-child { text-align: left; }
      .case-period-table tbody th { color: var(--ink-soft); font-weight: 600; text-align: left; }
      .case-period-table tbody td { color: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-align: right; white-space: nowrap; }
      .case-evaluation-card { overflow-x: auto; }
      .case-evaluation-table { min-width: 0; width: 100%; }
      .case-evaluation-table th, .case-evaluation-table td { text-align: left; vertical-align: top; line-height: 1.45; }
      .case-evaluation-table thead th { color: var(--blue); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
      .case-evaluation-table tbody th { width: 185px; color: var(--ink); font-weight: 600; }
      .case-evaluation-table tbody td:nth-child(2) { width: 160px; color: var(--ink); font-weight: 700; white-space: nowrap; }
      .case-period-note { margin: 7px 14px 9px; color: #7d8995; font-size: 10px; line-height: 1.5; }
      .case-matrix-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); gap: 12px; margin-top: 12px; }
      .case-matrix-grid.case-performance-matrix-grid { grid-template-columns: minmax(0, .88fr) minmax(0, 1.12fr); }
      .case-matrix-grid.case-sizing-components-grid { grid-template-columns: 1fr; }
      .case-matrix-card { padding: 15px 16px 12px; }
      .case-matrix-card .card-overline { color: var(--blue); }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; font-size: 11px; }
      th:first-child, td:first-child { text-align: left; }
      thead th { color: var(--blue); font-size: 9px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
      tbody th { font-weight: 600; }
      tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
      .case-note-block { padding: 16px 17px; }
      .case-note-block h3 { margin: 0; font-size: 15px; }
      .case-note-block p { margin: 10px 0 0; color: var(--ink-soft); font-size: 11.5px; line-height: 1.55; }
      .case-regime-grid h3 { margin-top: 8px; }
      .fine-print { color: #7d8995 !important; font-size: 10px !important; }

      .case-detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .case-data-detail-grid { margin-top: 18px; }
      .case-detail-card { min-height: 178px; padding: 16px 16px 14px; background: var(--paper-light); border: 1px solid var(--line); }
      .case-detail-label { color: var(--signal); }
      .case-detail-card h3 { margin: 23px 0 0; font-size: 15px; line-height: 1.25; }
      .case-detail-card p { margin: 9px 0 0; color: var(--ink-soft); font-size: 11.5px; line-height: 1.55; }

        .case-model-table tbody td:nth-child(n+3)::before { display: block; margin-bottom: 4px; color: var(--blue); font-size: 7px; font-weight: 700; letter-spacing: .06em; line-height: 1.2; text-transform: uppercase; }
        .case-model-table tbody td:nth-child(3)::before { content: 'RMSE'; }
        .case-model-table tbody td:nth-child(4)::before { content: 'MAE'; }
        .case-model-table tbody td:nth-child(5)::before { content: 'Pearson'; }
        .case-model-table tbody td:nth-child(6)::before { content: 'Spearman'; }
        .case-model-table tbody td:nth-child(7)::before { content: 'QLIKE'; }
      }
      @media (max-width: 900px) {
        .case-greek-connectors { display: block; height: auto; margin: 26px 0 16px; }
        .case-greek-connectors::before, .case-greek-connectors::after, .case-greek-branch { display: none; }
        .case-greek-connectors-label { position: static; transform: none; padding: 0; text-align: left; white-space: normal; }
        .case-greek-attribution-grid { padding-left: 16px; border-left: 1px solid #6e94b0; }
        .case-greek-card { position: relative; }
        .case-greek-card::before { position: absolute; left: -17px; top: 24px; width: 16px; border-top: 1px solid #6e94b0; content: ''; }
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .page-view.view-leaving, .page-view.view-entering { transition: none; animation: none; }
      }
    </style>

  <body>
    <a class="skip-link" href="#home-method">Skip to research method</a>
    <div class="site-shell">
      <header class="site-nav">
        <a class="brand" href="#home" data-route="home" aria-label="Independent Quantitative Research home">
          <span><strong>Independent Quantitative Research</strong><small>Jie Tang</small></span>
        </a>
        <nav class="nav-links" id="primary-nav" aria-label="Primary navigation">
          <div class="nav-demo-menu">
            <button class="nav-demo-trigger" type="button" aria-expanded="false" aria-controls="demo-dropdown">Research demos <span>+</span></button>
            <div class="nav-dropdown" id="demo-dropdown">
              <div class="dropdown-kicker">Available studies</div>
              <a href="#premarket-informed" data-route="premarket-informed">Premarket-to-Intraday Ranking <span>&rarr;</span></a>
              <a href="#long-straddle" data-route="long-straddle">Long Straddle with HAR Variance Forecasting <span>&rarr;</span></a>
            </div>
          </div>
        </nav>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
      </header>

      <div id="page-view" class="page-view" aria-live="polite"></div>
    </div>

    <script src="premarket-informed.js?v=20260912-1"></script>
    <script src="long-straddle.js?v=20260916-1"></script>
    <script>
      (function () {
        var view = document.getElementById('page-view');
        var nav = document.querySelector('.nav-links');
        var menuToggle = document.querySelector('.menu-toggle');
        var demoMenu = document.querySelector('.nav-demo-menu');
        var demoTrigger = document.querySelector('.nav-demo-trigger');

        var homeMarkup = `
          <main class="home-view" id="home">
            <section class="home-hero" id="top">
              <div class="content-width home-hero-grid">
                <div class="home-intro">
                  <h1>From Signal to Execution</h1>
                  <p class="home-lede">I’m an independent quantitative researcher studying systematic relationships across equities, volatility, and derivatives. My work combines interpretable statistical and machine-learning models with explicit decision, risk, and execution rules to test whether an economic relationship survives realistic implementation. Research is evaluated on held-out or walk-forward data using only information available at the decision point, with trading frictions and implementation constraints incorporated into the analysis.</p>
                  <div class="hero-demo-menu">
                    <button class="hero-demo-trigger" type="button" aria-expanded="false" aria-controls="home-demo-dropdown" data-hero-demo-trigger>View research demos <span>+</span></button>
                    <div class="hero-demo-dropdown" id="home-demo-dropdown">
                      <div class="dropdown-kicker">Available studies</div>
                      <a href="#premarket-informed" data-route="premarket-informed"><span class="hero-demo-copy"><strong>Premarket-to-Intraday Ranking</strong><small>Equities</small></span><span class="hero-demo-arrow">&rarr;</span></a>
                      <a href="#long-straddle" data-route="long-straddle"><span class="hero-demo-copy"><strong>Long Straddle with HAR Variance Forecasting</strong><small>Options / volatility</small></span><span class="hero-demo-arrow">&rarr;</span></a>
                    </div>
                  </div>
                </div>
                <div class="hero-facts" aria-label="Research pipeline">
                    <div class="scope-flow">
                      <div class="scope-step"><span class="scope-step-index">01</span><div class="scope-step-label">Inputs</div><strong>Market, volatility and time-series observations</strong></div>
                      <span class="scope-arrow" aria-hidden="true"><svg viewBox="0 0 32 24" focusable="false"><path d="M3 12h21M17 5l7 7-7 7"></path></svg></span>
                      <div class="scope-step"><span class="scope-step-index">02</span><div class="scope-step-label">Model + rules</div><strong>Statistical models and explicit decision rules</strong></div>
                      <span class="scope-arrow" aria-hidden="true"><svg viewBox="0 0 32 24" focusable="false"><path d="M3 12h21M17 5l7 7-7 7"></path></svg></span>
                      <div class="scope-step"><span class="scope-step-index">03</span><div class="scope-step-label">Outputs</div><strong>Signals, positions and trade decisions</strong></div>
                      <span class="scope-arrow" aria-hidden="true"><svg viewBox="0 0 32 24" focusable="false"><path d="M3 12h21M17 5l7 7-7 7"></path></svg></span>
                      <div class="scope-step"><span class="scope-step-index">04</span><div class="scope-step-label">Evaluation</div><strong>Holdout / walk-forward, execution-aware results</strong></div>
                    </div>
                </div>
              </div>
            </section>

            <section class="section home-method" id="home-method">
              <div class="content-width">
                <div class="home-method-head">
                  <h2>Method and principles</h2>
                </div>
                <div class="method-grid">
                  <article class="method-card"><div class="card-overline">01 / Economic connection</div><h3>Model a defined relationship</h3><p>Features are tied to an economic hypothesis and a stated performance target. Statistical association alone is not sufficient evidence.</p></article>
                  <article class="method-card"><div class="card-overline">02 / Estimation + rules</div><h3>Combine model estimates with rules</h3><p>Interpretable models provide forecasts or relative estimates. Ranking, thresholds, and execution conditions map those estimates to discrete decisions.</p></article>
                  <article class="method-card"><div class="card-overline">03 / Information integrity</div><h3>Enforce the information boundary</h3><p>Timestamps, missingness, target construction, normalization, leakage, and overfit controls are specified before performance is evaluated.</p></article>
                  <article class="method-card"><div class="card-overline">04 / Execution</div><h3>Measure the trade, not just the signal</h3><p>Order type, fillability, system latency, spread, and capacity are part of the simulation. A return is useful only after its execution assumptions are stated.</p></article>
                </div>
              </div>
            </section>

            <footer class="site-footer"><div class="content-width footer-inner"><div class="brand brand-footer"><span><strong>Independent Quantitative Research</strong><small>Jie Tang</small></span></div><div class="footer-right"><nav class="footer-links" aria-label="Contact links"><a href="https://www.linkedin.com/in/jie-tang-06983a15a/">LinkedIn</a><a href="mailto:tang.jieworking@outlook.com">tang.jieworking@outlook.com</a></nav><p class="footer-note">Not investment advice</p></div></div></footer>
          </main>
        `;

        function currentRoute() {
          var route = window.location.hash.replace('#', '');
          return route === 'premarket-informed' || route === 'long-straddle' ? route : 'home';
        }

        function closeMenus() {
          nav.classList.remove('nav-links-open');
          demoMenu.classList.remove('nav-demo-menu-open');
          menuToggle.setAttribute('aria-expanded', 'false');
          demoTrigger.setAttribute('aria-expanded', 'false');
        }

        function initHomeDemo() {
          var heroDemoTrigger = view.querySelector('[data-hero-demo-trigger]');
          if (!heroDemoTrigger) return;
          heroDemoTrigger.addEventListener('click', function (event) {
            event.preventDefault();
            var heroDemoMenu = heroDemoTrigger.parentElement;
            var heroDemoOpen = heroDemoMenu.classList.toggle('hero-demo-menu-open');
            heroDemoTrigger.setAttribute('aria-expanded', String(heroDemoOpen));
          });
        }

        function paint(route, animate) {
          var markup = route === 'premarket-informed' && window.premarketInformedView
            ? window.premarketInformedView()
            : route === 'long-straddle' && window.longStraddleView
              ? window.longStraddleView()
              : homeMarkup;
          if (animate) {
            view.classList.add('view-leaving');
            window.setTimeout(function () {
              view.innerHTML = markup;
              view.classList.remove('view-leaving');
              view.classList.remove('view-entering');
              void view.offsetWidth;
              view.classList.add('view-entering');
              if (route === 'premarket-informed' && window.initPremarketInformed) window.initPremarketInformed();
              if (route === 'long-straddle' && window.initLongStraddle) window.initLongStraddle();
              if (route === 'home') initHomeDemo();
              window.scrollTo({ top: 0, behavior: 'auto' });
            }, 220);
          } else {
            view.innerHTML = markup;
            if (route === 'premarket-informed' && window.initPremarketInformed) window.initPremarketInformed();
            if (route === 'long-straddle' && window.initLongStraddle) window.initLongStraddle();
            if (route === 'home') initHomeDemo();
          }
          closeMenus();
        }

        function transitionTo(route, updateHash) {
          if (updateHash && window.location.hash !== '#' + route) window.history.pushState({}, '', '#' + route);
          if (view.dataset.route === route) return;
          view.dataset.route = route;
          paint(route, true);
        }

        document.addEventListener('click', function (event) {
          var routeLink = event.target.closest ? event.target.closest('[data-route]') : null;
          if (routeLink) {
            event.preventDefault();
            transitionTo(routeLink.getAttribute('data-route'), true);
            return;
          }
          if (event.target === menuToggle) {
            var open = nav.classList.toggle('nav-links-open');
            menuToggle.setAttribute('aria-expanded', String(open));
            return;
          }
          if (event.target === demoTrigger || demoTrigger.contains(event.target)) {
            var demoOpen = demoMenu.classList.toggle('nav-demo-menu-open');
            demoTrigger.setAttribute('aria-expanded', String(demoOpen));
          }
        });

        window.addEventListener('popstate', function () {
          var route = currentRoute();
          if (view.dataset.route !== route) {
            view.dataset.route = route;
            paint(route, true);
          }
        });
        window.addEventListener('hashchange', function () {
          var route = currentRoute();
          if (view.dataset.route !== route) {
            view.dataset.route = route;
            paint(route, true);
          }
        });

        var initialRoute = currentRoute();
        view.dataset.route = initialRoute;
        paint(initialRoute, false);
      }());
    </script>
  </body>
</html>
